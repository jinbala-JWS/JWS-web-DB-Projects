<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirograph Studio — 스피로그래프 스튜디오</title>
<style>
  :root{
    --bg:#0f1016; --panel:#181923; --text:#f0eee9; --muted:#8b8898;
    --border:#2a2b38; --accent:#8fe3d0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f5f2; --panel:#ffffff; --text:#1c1b1a; --muted:#736f68; --border:#e6e3dc; --accent:#1a8f78; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding: 28px 16px 40px;
  }
  .title{ font-size:20px; font-weight:800; margin-bottom:2px; }
  .subtitle{ color:var(--muted); font-size:13px; margin-bottom:22px; }
  .layout{ width:100%; max-width:1000px; display:flex; gap:22px; }
  @media (max-width:820px){ .layout{ flex-direction:column; } }
  .canvas-wrap{
    flex:1; background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:14px; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  }
  canvas{ width:100%; max-width:560px; aspect-ratio:1/1; border-radius:12px; cursor:crosshair; background:#000; }
  .panel{
    width:280px; flex-shrink:0; background:var(--panel); border:1px solid var(--border);
    border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:16px;
  }
  @media (max-width:820px){ .panel{ width:100%; } }
  .field label{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .field label span.val{ color:var(--text); font-weight:700; }
  input[type=range]{ width:100%; accent-color: var(--accent); }
  .row{ display:flex; gap:8px; }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:1px solid var(--border); background:transparent;
    color:var(--text); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition: all .12s;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn.primary{ background:var(--accent); color:#0f1016; border-color:transparent; }
  .swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.active{ border-color: var(--text); }
  .hint{ font-size:11.5px; color:var(--muted); line-height:1.5; }
  .stat{ font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="title">🌀 Spirograph Studio</div>
  <div class="subtitle">파라미터를 조절해 패턴을 그려보세요. 캔버스를 드래그해도 그려집니다.</div>

  <div class="layout">
    <div class="canvas-wrap">
      <canvas id="canvas" width="560" height="560"></canvas>
    </div>
    <div class="panel">
      <div class="field">
        <label>큰 원 반지름 (R) <span class="val" id="rVal">120</span></label>
        <input type="range" id="rBig" min="30" max="220" value="120">
      </div>
      <div class="field">
        <label>작은 원 반지름 (r) <span class="val" id="rSmallVal">55</span></label>
        <input type="range" id="rSmall" min="5" max="150" value="55">
      </div>
      <div class="field">
        <label>펜 거리 (d) <span class="val" id="dVal">70</span></label>
        <input type="range" id="dPen" min="5" max="200" value="70">
      </div>
      <div class="field">
        <label>그리기 속도 <span class="val" id="speedVal">4</span></label>
        <input type="range" id="speed" min="1" max="12" value="4">
      </div>
      <div class="field">
        <label>선 굵기 <span class="val" id="widthVal">1.5</span></label>
        <input type="range" id="lineWidth" min="1" max="6" step="0.5" value="1.5">
      </div>
      <div class="field">
        <label>색상</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="playPause">일시정지</button>
        <button class="btn" id="clearBtn">지우기</button>
      </div>
      <div class="row">
        <button class="btn" id="randomBtn">🎲 랜덤</button>
        <button class="btn" id="saveBtn">💾 저장</button>
      </div>
      <div class="stat" id="stat">회전각: 0°</div>
      <div class="hint">Tip: R과 r의 비율이 패턴의 대칭(꽃잎) 개수를 결정해요. 캔버스를 드래그하면 마우스 위치가 펜 거리에 영향을 줍니다.</div>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  const rBigEl = document.getElementById('rBig');
  const rSmallEl = document.getElementById('rSmall');
  const dPenEl = document.getElementById('dPen');
  const speedEl = document.getElementById('speed');
  const lineWidthEl = document.getElementById('lineWidth');
  const rVal = document.getElementById('rVal');
  const rSmallVal = document.getElementById('rSmallVal');
  const dVal = document.getElementById('dVal');
  const speedVal = document.getElementById('speedVal');
  const widthVal = document.getElementById('widthVal');
  const stat = document.getElementById('stat');
  const playPauseBtn = document.getElementById('playPause');
  const clearBtn = document.getElementById('clearBtn');
  const randomBtn = document.getElementById('randomBtn');
  const saveBtn = document.getElementById('saveBtn');
  const swatchesEl = document.getElementById('swatches');

  const colors = ['#8fe3d0','#ff6a3d','#ffd166','#ef476f','#6a8dff','#c77dff','#ffffff','__rainbow__'];
  let colorIndex = 0;
  colors.forEach((c,i) => {
    const s = document.createElement('div');
    s.className = 'swatch' + (i===0 ? ' active' : '');
    s.style.background = c === '__rainbow__'
      ? 'conic-gradient(red, yellow, lime, cyan, blue, magenta, red)'
      : c;
    s.title = c === '__rainbow__' ? '무지개' : '';
    s.addEventListener('click', () => {
      colorIndex = i;
      [...swatchesEl.children].forEach(ch => ch.classList.remove('active'));
      s.classList.add('active');
    });
    swatchesEl.appendChild(s);
  });

  function fillBg(){
    ctx.fillStyle = 'black';
    ctx.fillRect(0,0,W,H);
  }
  fillBg();

  let t = 0;
  let running = true;
  let hue = 0;
  let lastPoint = null;

  function params(){
    return {
      R: +rBigEl.value,
      r: +rSmallEl.value,
      d: +dPenEl.value,
      speed: +speedEl.value,
      lw: +lineWidthEl.value
    };
  }

  function pointAt(angle, p){
    const {R, r, d} = p;
    const k = (R - r) / r;
    const x = (R - r) * Math.cos(angle) + d * Math.cos(k * angle);
    const y = (R - r) * Math.sin(angle) - d * Math.sin(k * angle);
    return { x: cx + x, y: cy + y };
  }

  function useColor(){
    if(colors[colorIndex] === '__rainbow__') return `hsl(${hue},80%,65%)`;
    return colors[colorIndex];
  }

  function step(){
    if(!running) return;
    const p = params();
    const dt = 0.01 * (p.speed / 3);
    for(let i=0;i<6;i++){
      const pt = pointAt(t, p);
      if(lastPoint){
        ctx.beginPath();
        ctx.strokeStyle = useColor();
        ctx.lineWidth = p.lw;
        ctx.lineCap = 'round';
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      }
      lastPoint = pt;
      t += dt;
    }
    hue = (hue + 0.6) % 360;
    stat.textContent = `회전각: ${Math.round((t * 180/Math.PI) % 360)}°`;
    requestAnimationFrame(step);
  }

  function syncLabels(){
    rVal.textContent = rBigEl.value;
    rSmallVal.textContent = rSmallEl.value;
    dVal.textContent = dPenEl.value;
    speedVal.textContent = speedEl.value;
    widthVal.textContent = lineWidthEl.value;
  }
  [rBigEl,rSmallEl,dPenEl,speedEl,lineWidthEl].forEach(el => el.addEventListener('input', syncLabels));
  syncLabels();

  playPauseBtn.addEventListener('click', () => {
    running = !running;
    playPauseBtn.textContent = running ? '일시정지' : '재생';
    if(running) requestAnimationFrame(step);
  });

  clearBtn.addEventListener('click', () => {
    fillBg();
    t = 0;
    lastPoint = null;
  });

  randomBtn.addEventListener('click', () => {
    rBigEl.value = 40 + Math.floor(Math.random()*180);
    rSmallEl.value = 5 + Math.floor(Math.random()*140);
    dPenEl.value = 5 + Math.floor(Math.random()*190);
    syncLabels();
    fillBg();
    t = 0;
    lastPoint = null;
  });

  saveBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `spirograph-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Drag to draw manually
  let dragging = false;
  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = (clientX - rect.left) * (W / rect.width);
    const y = (clientY - rect.top) * (H / rect.height);
    return {x, y};
  }
  let manualLast = null;
  function startDrag(e){
    dragging = true;
    manualLast = canvasPointFromEvent(e);
  }
  function moveDrag(e){
    if(!dragging) return;
    const p = canvasPointFromEvent(e);
    ctx.beginPath();
    ctx.strokeStyle = useColor();
    ctx.lineWidth = params().lw + 1;
    ctx.lineCap = 'round';
    ctx.moveTo(manualLast.x, manualLast.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    manualLast = p;
    e.preventDefault();
  }
  function endDrag(){ dragging = false; manualLast = null; }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', startDrag, {passive:false});
  canvas.addEventListener('touchmove', moveDrag, {passive:false});
  canvas.addEventListener('touchend', endDrag);

  requestAnimationFrame(step);
})();
</script>
</body>
</html>
